name: Test mcp-server

on:
  pull_request:
    paths:
      - mcp-server/**
      - lib/**
  push:
    paths:
      - mcp-server/**
      - lib/**
    branches:
      - main

env:
  GO_VERSION: '1.25'
  TASK_VERSION: '3.38.0'

jobs:
  test-mcp-server:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Task
        uses: go-task/setup-task@v1
        with:
          version: ${{ env.TASK_VERSION }}

      # mcp-server has no proto files and no infrastructure to spin up: its
      # tests are unit tests over mocked gRPC clients, so no docker compose here.
      - name: Run tests
        working-directory: mcp-server
        run: task test
