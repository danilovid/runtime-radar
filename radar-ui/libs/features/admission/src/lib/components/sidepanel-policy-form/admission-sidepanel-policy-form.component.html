<ng-container *transloco="let tAdmission; prefix: 'admission'">
    <kbq-sidepanel-header [closeable]="true">
        {{ props.isEdit ? tAdmission('Admission.PolicyForm.Title.Edit') : tAdmission('Admission.PolicyForm.Title.Create') }}
    </kbq-sidepanel-header>

    <kbq-sidepanel-body>
        <form [formGroup]="form" class="kbq-form-vertical">
            <section class="kbq-form__row kbq-form-row_margin">
                <label for="name" class="kbq-form__label">
                    {{ tAdmission('Admission.PolicyForm.Label.Name') }}
                </label>
                <kbq-form-field class="kbq-form__control">
                    <input kbqInput
                           cdkFocusInitial
                           type="text"
                           id="name"
                           formControlName="name"
                           data-testid="admission-policy-name-input">
                </kbq-form-field>
            </section>

            <section class="kbq-form__row kbq-form-row_margin">
                <label for="description" class="kbq-form__label">
                    {{ tAdmission('Admission.PolicyForm.Label.Description') }}
                </label>
                <kbq-form-field class="kbq-form__control">
                    <textarea kbqTextarea
                              [freeRowsHeight]="0"
                              id="description"
                              formControlName="description"
                              data-testid="admission-policy-description-textarea"></textarea>
                </kbq-form-field>
            </section>

            <section class="kbq-form__row">
                <label for="yaml" class="kbq-form__label">
                    {{ tAdmission('Admission.PolicyForm.Label.Yaml') }}
                </label>
                <kbq-form-field class="kbq-form__control admission-feature-sidepanel-policy-form-textarea">
                    <textarea kbqTextarea
                              [freeRowsHeight]="0"
                              id="yaml"
                              formControlName="yaml"
                              class="admission-feature-sidepanel-policy-form-textarea-control"
                              data-testid="admission-policy-yaml-textarea"></textarea>
                    @if (form.get('yaml')?.hasError('code')) {
                        <kbq-hint color="error">{{ tAdmission('Admission.PolicyForm.Error.Yaml', { line: form.get('yaml')?.getError('code').line }) }}</kbq-hint>
                    }
                </kbq-form-field>
            </section>
        </form>
    </kbq-sidepanel-body>

    <kbq-sidepanel-footer>
        <kbq-sidepanel-actions align="left">
            <button kbq-button
                    kbqStyle="outline"
                    color="theme-fade"
                    type="button"
                    [disabled]="(isFormValid$ | async) === false"
                    (click)="confirm()"
                    data-testid="admission-policy-confirm-button">
                {{ props.isEdit ? tAdmission('Admission.PolicyForm.Button.Update') : tAdmission('Admission.PolicyForm.Button.Confirm') }}
            </button>
        </kbq-sidepanel-actions>
        <kbq-sidepanel-actions align="right">
            <button kbq-button
                    type="button"
                    (click)="cancel()"
                    data-testid="admission-policy-cancel-button">
                {{ tAdmission('Admission.PolicyForm.Button.Cancel') }}
            </button>
        </kbq-sidepanel-actions>
    </kbq-sidepanel-footer>
</ng-container>
