syntax = "proto3";

package admission_event;

import "google/protobuf/timestamp.proto";

import "admission_config.proto";


option go_package = "./api";

// AdmissionEvent is a normalized result of a single Kyverno policy evaluation.
// It is produced by admission-monitor and published to history-api the same way
// event-processor publishes runtime_event.RuntimeEvent.
message AdmissionEvent {
    // id (as UUID) is generated by admission-monitor, so that it can be used in notifier templates
    // when sending notifications, for building URL pointing to a particular event, or as a supplementary info
    string id = 1;
    string kyverno_version = 2;
    google.protobuf.Timestamp registered_at = 3;

    Resource resource = 4;
    repeated Threat threats = 5;

    // blocked is true when Kyverno itself denied the request (policy action is ENFORCE).
    bool blocked = 6;
    bool is_incident = 7;
    string incident_severity = 8;
    repeated string block_by = 9;
    repeated string notify_by = 10;
}

// Resource describes the object the policy was evaluated against.
message Resource {
    string api_version = 1;
    string kind = 2;
    string namespace = 3;
    string name = 4;
    string uid = 5;
    string node_name = 6;
    repeated Container containers = 7;
}

message Container {
    string name = 1;
    string image_name = 2;
    string registry = 3;
}

// Threat is a single failed policy rule. Kyverno policy plays the same role here
// as a WASM detector does in event-processor.
message Threat {
    Policy policy = 1;
    string severity = 2;
}

// Policy identifies the Kyverno policy and rule which produced the threat.
message Policy {
    // id is "<policy name>/<rule name>", it is stable and is used to whitelist a threat in policy-enforcer rules.
    string id = 1;
    string name = 2;
    string rule = 3;
    string category = 4;
    string description = 5;
    // source is reported by Kyverno, e.g. "KyvernoValidatingPolicy" or "KyvernoImageValidatingPolicy".
    string source = 6;
    admission_config.KyvernoPolicy.Action action = 7;
}
